<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="60%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#1E2636"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131720"/>
      <stop offset="30%" stop-color="#18202E"/>
      <stop offset="100%" stop-color="#0F131A"/>
    </linearGradient>
    <radialGradient id="lampGlow1" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#F5B301" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#F5B301" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow2" cx="20%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#F5B301" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow3" cx="80%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#F5B301" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Industrial Atmosphere -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  <rect x="0" y="520" width="1600" height="380" fill="url(#floorGrad)"/>

  <!-- Light Cones -->
  <rect width="1600" height="900" fill="url(#lampGlow1)"/>
  <rect width="1600" height="900" fill="url(#lampGlow2)"/>
  <rect width="1600" height="900" fill="url(#lampGlow3)"/>

  <!-- Steel Trusses & Gantry Beams -->
  <g stroke="#263143" stroke-width="3" opacity="0.6">
    <line x1="0" y1="120" x2="1600" y2="120" stroke-width="12"/>
    <line x1="0" y1="180" x2="1600" y2="180" stroke-width="8"/>
    <!-- Diagonal Lattice -->
    <path d="M 0 120 L 100 180 L 200 120 L 300 180 L 400 120 L 500 180 L 600 120 L 700 180 L 800 120 L 900 180 L 1000 120 L 1100 180 L 1200 120 L 1300 180 L 1400 120 L 1500 180 L 1600 120" fill="none"/>
  </g>

  <!-- High-Bay Factory Lamps -->
  <g fill="#F5B301" opacity="0.85">
    <polygon points="310,180 330,180 340,210 300,210"/>
    <ellipse cx="320" cy="210" rx="20" ry="6" fill="#FFF"/>
    <polygon points="790,180 810,180 820,210 780,210"/>
    <ellipse cx="800" cy="210" rx="20" ry="6" fill="#FFF"/>
    <polygon points="1270,180 1290,180 1300,210 1260,210"/>
    <ellipse cx="1280" cy="210" rx="20" ry="6" fill="#FFF"/>
  </g>

  <!-- Factory Floor Perspective Lines -->
  <g stroke="#202A3C" stroke-width="1.5" opacity="0.7">
    <line x1="800" y1="520" x2="0" y2="900"/>
    <line x1="800" y1="520" x2="350" y2="900"/>
    <line x1="800" y1="520" x2="650" y2="900"/>
    <line x1="800" y1="520" x2="950" y2="900"/>
    <line x1="800" y1="520" x2="1250" y2="900"/>
    <line x1="800" y1="520" x2="1600" y2="900"/>
    <!-- Yellow Factory Safety Walkway Line -->
    <line x1="800" y1="520" x2="1100" y2="900" stroke="#F5B301" stroke-width="4" stroke-dasharray="24,16" opacity="0.5"/>
  </g>

  <!-- Background Machinery Silhouettes (Row of Shoe Press & Lasting Units) -->
  <g fill="#182232" opacity="0.85">
    <!-- Left Machine Block -->
    <rect x="180" y="440" width="120" height="150" rx="4"/>
    <rect x="200" y="380" width="80" height="70" rx="2"/>
    <rect x="220" y="330" width="40" height="60" fill="#26354D"/>
    <!-- Amber Status Beacon -->
    <circle cx="240" cy="320" r="8" fill="#F5B301"/>

    <!-- Center Left Machine (Heavy Press) -->
    <rect x="420" y="420" width="160" height="180" rx="6"/>
    <rect x="460" y="320" width="80" height="110" rx="3"/>
    <rect x="480" y="270" width="40" height="60" fill="#2E3E59"/>
    <circle cx="500" cy="260" r="8" fill="#22C55E"/>

    <!-- Center Right Machine (Conveyor Setter) -->
    <rect x="880" y="450" width="220" height="140" rx="6"/>
    <rect x="910" y="390" width="160" height="70" rx="4" fill="#202C3F"/>
    <line x1="930" y1="420" x2="1050" y2="420" stroke="#F5B301" stroke-width="4"/>
    <circle cx="990" cy="380" r="8" fill="#F5B301"/>

    <!-- Right Machine (Hydraulic Cutting Press) -->
    <rect x="1220" y="430" width="150" height="170" rx="6"/>
    <rect x="1250" y="360" width="90" height="80" rx="3"/>
    <circle cx="1295" cy="350" r="8" fill="#22C55E"/>
  </g>

  <!-- Floor Reflections of Amber Lamps -->
  <ellipse cx="320" cy="620" rx="90" ry="20" fill="#F5B301" opacity="0.08"/>
  <ellipse cx="800" cy="620" rx="120" ry="25" fill="#F5B301" opacity="0.12"/>
  <ellipse cx="1280" cy="620" rx="90" ry="20" fill="#F5B301" opacity="0.08"/>
</svg>

