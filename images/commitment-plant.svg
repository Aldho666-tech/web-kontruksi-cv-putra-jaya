<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="commBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <filter id="boxDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="16" fill="url(#commBg)"/>

  <!-- Warehouse Racks & Clean Industrial Bay -->
  <g stroke="#334155" stroke-width="2" opacity="0.4">
    <!-- Steel Beams -->
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="160" x2="720" y2="160"/>
    <line x1="80" y1="80" x2="80" y2="520"/>
    <line x1="720" y1="80" x2="720" y2="520"/>
    <line x1="240" y1="80" x2="240" y2="520"/>
    <line x1="560" y1="80" x2="560" y2="520"/>
  </g>

  <!-- Technical Calibration Bay Representation -->
  <g filter="url(#boxDrop)">
    <!-- Testing Workstation Center -->
    <rect x="220" y="220" width="360" height="260" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="220" y="216" width="360" height="12" rx="4" fill="url(#glowG)"/>

    <!-- Machine Tested: Post Bed Sewing & Sole Press Unit -->
    <rect x="260" y="260" width="130" height="170" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect x="280" y="300" width="90" height="80" rx="4" fill="#020617"/>
    <!-- Status LED -->
    <circle cx="325" cy="330" r="10" fill="#22C55E"/>
    <text x="325" y="360" font-family="monospace" font-size="9" fill="#22C55E" text-anchor="middle">CALIBRATED</text>

    <!-- Calibration Monitor / QC Checklist -->
    <rect x="420" y="260" width="130" height="170" rx="8" fill="#020617" stroke="#F5B301" stroke-width="1.5"/>
    <text x="485" y="285" font-family="Poppins, sans-serif" font-size="10" font-weight="700" fill="#F5B301" text-anchor="middle">QC 100% CHECK</text>

    <!-- Checklist rows -->
    <g transform="translate(435, 305)" font-family="Poppins, sans-serif" font-size="9" fill="#E2E8F0">
      <circle cx="10" cy="5" r="5" fill="#22C55E"/>
      <text x="22" y="9">Uji Presisi Tekan</text>

      <circle cx="10" cy="30" r="5" fill="#22C55E"/>
      <text x="22" y="34">Inspeksi Kelistrikan</text>

      <circle cx="10" cy="55" r="5" fill="#22C55E"/>
      <text x="22" y="59">Kekuatan Hidrolik</text>

      <circle cx="10" cy="80" r="5" fill="#22C55E"/>
      <text x="22" y="84">Suku Cadang Siap</text>
    </g>

    <!-- Bottom Verification Seal Badge -->
    <rect x="290" y="440" width="220" height="30" rx="15" fill="#F5B301"/>
    <text x="400" y="460" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#020617" text-anchor="middle">STANDAR KUALITAS CV PUTRA JAYA</text>
  </g>

  <!-- Left & Right Spareparts Shelves -->
  <g fill="#1E293B" stroke="#334155" stroke-width="1">
    <rect x="100" y="200" width="100" height="50" rx="4"/>
    <rect x="100" y="270" width="100" height="50" rx="4"/>
    <rect x="100" y="340" width="100" height="50" rx="4"/>
    <rect x="100" y="410" width="100" height="50" rx="4"/>

    <rect x="600" y="200" width="100" height="50" rx="4"/>
    <rect x="600" y="270" width="100" height="50" rx="4"/>
    <rect x="600" y="340" width="100" height="50" rx="4"/>
    <rect x="600" y="410" width="100" height="50" rx="4"/>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(80, 50)">
    <text x="0" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#F5B301" letter-spacing="2">CV PUTRA JAYA — WORKSHOP &amp; WAREHOUSE</text>
    <text x="0" y="20" font-family="Poppins, sans-serif" font-size="11" fill="#94A3B8">Pusat Uji Kelaikan &amp; Kesiapan Mesin Produksi Alas Kaki</text>
  </g>
</svg>

