<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="lastingDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="lastingShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgG3)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Machine: Automatic Toe Lasting Machine (9 Pincers PLC) -->
  <g filter="url(#lastingShadow)">
    <!-- Base Cabinet Stand -->
    <rect x="150" y="320" width="300" height="190" rx="12" fill="url(#lastingDark)"/>
    <rect x="160" y="505" width="50" height="15" rx="3" fill="#020617"/>
    <rect x="390" y="505" width="50" height="15" rx="3" fill="#020617"/>

    <!-- Front Service Doors & Louvers -->
    <rect x="170" y="340" width="125" height="145" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect x="305" y="340" width="125" height="145" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <!-- Handles -->
    <rect x="280" y="390" width="6" height="30" rx="2" fill="#F5B301"/>
    <rect x="314" y="390" width="6" height="30" rx="2" fill="#F5B301"/>

    <!-- Ventilation Louvers -->
    <line x1="185" y1="440" x2="255" y2="440" stroke="#475569" stroke-width="2"/>
    <line x1="185" y1="450" x2="255" y2="450" stroke="#475569" stroke-width="2"/>
    <line x1="185" y1="460" x2="255" y2="460" stroke="#475569" stroke-width="2"/>

    <!-- Upper Lasting Workstation (Slanted Enclosure) -->
    <path d="M 130 320 L 170 200 L 430 200 L 470 320 Z" fill="url(#lastingDark)" stroke="#334155" stroke-width="2"/>
    <rect x="170" y="195" width="260" height="10" fill="url(#accentYellow)"/>

    <!-- Central Lasting Head (Shoe Last Form Support) -->
    <rect x="260" y="220" width="80" height="60" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <!-- Shoe Form Last (Mockup Shoe Silhouette in Forming) -->
    <path d="M 270 240 Q 300 215 330 235 Q 325 255 270 255 Z" fill="url(#accentYellow)"/>

    <!-- Hydraulic Pincers / Cakar 9 Titik -->
    <circle cx="250" cy="225" r="5" fill="#E2E8F0"/>
    <circle cx="270" cy="215" r="5" fill="#E2E8F0"/>
    <circle cx="290" cy="210" r="5" fill="#E2E8F0"/>
    <circle cx="310" cy="210" r="5" fill="#E2E8F0"/>
    <circle cx="330" cy="215" r="5" fill="#E2E8F0"/>
    <circle cx="350" cy="225" r="5" fill="#E2E8F0"/>
    <line x1="250" y1="230" x2="265" y2="245" stroke="#94A3B8" stroke-width="2"/>
    <line x1="350" y1="230" x2="335" y2="245" stroke="#94A3B8" stroke-width="2"/>

    <!-- Teflon Heated Wiper Plates (Plat Penekan Ujung Sepatu) -->
    <path d="M 280 250 L 320 250 L 310 262 L 290 262 Z" fill="#EF4444"/>

    <!-- Articulating PLC Touchscreen Panel (Right Arm) -->
    <line x1="420" y1="230" x2="470" y2="170" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
    <rect x="420" y="110" width="115" height="85" rx="6" fill="#0F172A" stroke="#F5B301" stroke-width="2"/>
    <rect x="428" y="118" width="99" height="69" rx="3" fill="url(#screenGrad)"/>
    <!-- Screen UI Elements -->
    <rect x="435" y="125" width="85" height="14" rx="2" fill="#3B82F6"/>
    <text x="477" y="135" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">TOE LASTING v3.2</text>
    <rect x="435" y="145" width="38" height="16" rx="2" fill="#1E293B"/>
    <text x="454" y="156" font-family="monospace" font-size="8" fill="#22C55E" text-anchor="middle">5.5 MPa</text>
    <rect x="480" y="145" width="40" height="16" rx="2" fill="#1E293B"/>
    <text x="500" y="156" font-family="monospace" font-size="8" fill="#F5B301" text-anchor="middle">135°C</text>
    <rect x="435" y="167" width="85" height="12" rx="2" fill="#22C55E"/>
    <text x="477" y="176" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#0F172A" text-anchor="middle">READY / AUTO</text>

    <!-- Dual Safety Start Buttons -->
    <circle cx="160" cy="305" r="14" fill="#22C55E" stroke="#0F172A" stroke-width="3"/>
    <circle cx="440" cy="305" r="14" fill="#22C55E" stroke="#0F172A" stroke-width="3"/>

    <!-- Emergency Stop Mushroom Button -->
    <circle cx="200" cy="275" r="14" fill="#DC2626" stroke="#FEF2F2" stroke-width="2"/>

    <!-- Brand Identity Strip -->
    <rect x="220" y="485" width="160" height="20" rx="3" fill="#0F172A" stroke="#F5B301" stroke-width="1"/>
    <text x="300" y="498" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#F5B301" text-anchor="middle">PUTRA JAYA LASTING TECH</text>
  </g>

  <!-- Spec Badges -->
  <g transform="translate(40, 50)">
    <rect width="155" height="26" rx="13" fill="#F5B301"/>
    <text x="77" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">MODEL: PJ-LAST-AUTO</text>
  </g>
  <g transform="translate(410, 50)">
    <rect width="150" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="485" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">9-PINCER HYDRAULIC</text>
  </g>
</svg>

