<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG16" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="chDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="chYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <linearGradient id="frostBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="chShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgG16)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Machine: Flash Chiller Setter Machine (PJ-CHILL-SET) -->
  <g filter="url(#chShadow)">
    <rect x="120" y="440" width="360" height="65" rx="8" fill="url(#chDark)"/>
    <rect x="150" y="505" width="50" height="15" rx="3" fill="#020617"/>
    <rect x="400" y="505" width="50" height="15" rx="3" fill="#020617"/>

    <!-- Main Insulated Chiller Cabinet -->
    <rect x="140" y="210" width="320" height="230" rx="10" fill="url(#chDark)" stroke="#334155" stroke-width="2"/>
    <rect x="140" y="205" width="320" height="15" fill="url(#chYellow)"/>

    <!-- Cold Evaporator Chamber / Frost Glass Window -->
    <rect x="170" y="245" width="160" height="120" rx="6" fill="#020617" stroke="#38BDF8" stroke-width="2"/>
    <rect x="176" y="251" width="148" height="108" rx="4" fill="url(#frostBlue)" opacity="0.6"/>

    <!-- Snowflake / Cold Indicator -->
    <g transform="translate(250, 305)" stroke="#FFFFFF" stroke-width="2">
      <line x1="0" y1="-20" x2="0" y2="20"/>
      <line x1="-20" y1="0" x2="20" y2="0"/>
      <line x1="-14" y1="-14" x2="14" y2="14"/>
      <line x1="-14" y1="14" x2="14" y2="-14"/>
    </g>

    <!-- Compressor Condenser Section (Right Louvers) -->
    <rect x="350" y="245" width="90" height="120" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <line x1="360" y1="265" x2="430" y2="265" stroke="#475569" stroke-width="2"/>
    <line x1="360" y1="285" x2="430" y2="285" stroke="#475569" stroke-width="2"/>
    <line x1="360" y1="305" x2="430" y2="305" stroke="#475569" stroke-width="2"/>
    <line x1="360" y1="325" x2="430" y2="325" stroke="#475569" stroke-width="2"/>
    <line x1="360" y1="345" x2="430" y2="345" stroke="#475569" stroke-width="2"/>

    <!-- Conveyor Inlet / Outlet Trays -->
    <rect x="80" y="380" width="70" height="20" rx="3" fill="#64748B"/>
    <rect x="450" y="380" width="70" height="20" rx="3" fill="#64748B"/>

    <!-- Digital Temperature Controller Display -->
    <rect x="230" y="385" width="140" height="40" rx="6" fill="#020617" stroke="#F5B301" stroke-width="1.5"/>
    <rect x="240" y="393" width="65" height="24" rx="2" fill="#082F49"/>
    <text x="272" y="410" font-family="monospace" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">-12°C</text>
    <circle cx="325" cy="405" r="5" fill="#22C55E"/>
    <circle cx="345" cy="405" r="5" fill="#EF4444"/>

    <rect x="210" y="460" width="180" height="25" rx="3" fill="#020617" stroke="#F5B301" stroke-width="1"/>
    <text x="300" y="476" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#F5B301" text-anchor="middle">FLASH CHILLER STABILIZER</text>
  </g>

  <g transform="translate(40, 50)">
    <rect width="165" height="26" rx="13" fill="#F5B301"/>
    <text x="82" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">MODEL: PJ-CHILL-SET</text>
  </g>
  <g transform="translate(405, 50)">
    <rect width="155" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="482" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">CHILLER PENDINGIN SOL</text>
  </g>
</svg>

