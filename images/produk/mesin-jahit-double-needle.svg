<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="ironDark7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="amberGold7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <filter id="dnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgG7)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Machine: Post-Bed Double Needle Sewing Machine -->
  <g filter="url(#dnShadow)">
    <rect x="110" y="440" width="380" height="24" rx="3" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="120" y="464" width="360" height="50" rx="4" fill="url(#ironDark7)"/>
    <rect x="150" y="514" width="40" height="15" rx="2" fill="#0F172A"/>
    <rect x="410" y="514" width="40" height="15" rx="2" fill="#0F172A"/>

    <!-- Double Needle Post -->
    <rect x="205" y="290" width="55" height="150" rx="6" fill="url(#ironDark7)"/>
    <rect x="200" y="280" width="65" height="14" rx="3" fill="#CBD5E1"/>
    <!-- Double Needles -->
    <line x1="228" y1="240" x2="228" y2="295" stroke="#334155" stroke-width="2.5"/>
    <line x1="237" y1="240" x2="237" y2="295" stroke="#334155" stroke-width="2.5"/>

    <!-- Main Arm Casting -->
    <path d="M 370 440 L 440 440 L 440 230 C 440 200 410 180 370 180 L 190 180 C 170 180 160 195 160 215 L 160 260 L 210 260 L 210 230 L 360 230 L 370 440 Z" fill="url(#ironDark7)"/>
    <rect x="160" y="200" width="280" height="16" fill="url(#amberGold7)"/>

    <!-- Tensioners (Double) -->
    <circle cx="255" cy="210" r="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <circle cx="282" cy="210" r="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>

    <!-- Integrated Servo Motor -->
    <rect x="430" y="230" width="45" height="110" rx="8" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="452" cy="285" r="28" fill="#CBD5E1"/>
    <circle cx="452" cy="285" r="10" fill="url(#amberGold7)"/>

    <!-- Thread Spool Rack (Triple Spool) -->
    <line x1="390" y1="180" x2="390" y2="105" stroke="#94A3B8" stroke-width="3"/>
    <line x1="330" y1="105" x2="450" y2="105" stroke="#94A3B8" stroke-width="3"/>
    <path d="M 340 105 L 348 135 L 362 135 L 370 105 Z" fill="#F5B301" opacity="0.8"/>
    <path d="M 380 105 L 388 135 L 402 135 L 410 105 Z" fill="#EF4444" opacity="0.8"/>
    <path d="M 420 105 L 428 135 L 442 135 L 450 105 Z" fill="#3B82F6" opacity="0.8"/>

    <!-- Model Plaque -->
    <rect x="245" y="475" width="140" height="28" rx="4" fill="#1E293B" stroke="#F5B301" stroke-width="1"/>
    <text x="315" y="488" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#F5B301" text-anchor="middle">DOUBLE NEEDLE POST</text>
    <text x="315" y="498" font-family="Poppins, sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle">HEAVY DUTY GAUGE 2.4MM</text>
  </g>

  <!-- Badges -->
  <g transform="translate(40, 50)">
    <rect width="160" height="26" rx="13" fill="#F5B301"/>
    <text x="80" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">MODEL: PJ-POST-820D</text>
  </g>
  <g transform="translate(405, 50)">
    <rect width="155" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="482" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">DOUBLE NEEDLE TIANG</text>
  </g>
</svg>

