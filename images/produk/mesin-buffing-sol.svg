<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="bufDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bufYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <filter id="bufShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgG12)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Machine: Dual Head Buffing & Sole Roughing Machine (PJ-BUFF-DUAL) -->
  <g filter="url(#bufShadow)">
    <rect x="150" y="340" width="300" height="170" rx="10" fill="url(#bufDark)"/>
    <rect x="170" y="505" width="50" height="15" rx="3" fill="#020617"/>
    <rect x="380" y="505" width="50" height="15" rx="3" fill="#020617"/>

    <!-- Dual Spindle Motor Housing (Center Upper) -->
    <rect x="210" y="240" width="180" height="105" rx="8" fill="url(#bufDark)" stroke="#334155" stroke-width="2"/>
    <rect x="210" y="235" width="180" height="12" fill="url(#bufYellow)"/>

    <!-- Left Buffing Wheel (Coarse Sanding Drum / Amplas Kasar) -->
    <rect x="140" y="250" width="70" height="85" rx="6" fill="#F5B301" stroke="#D99A00" stroke-width="2"/>
    <rect x="135" y="260" width="80" height="65" rx="3" fill="#B45309" opacity="0.3"/>
    <!-- Wheel Guard Hood -->
    <path d="M 130 240 L 210 240 L 210 350 L 130 320 Z" fill="none" stroke="#94A3B8" stroke-width="3"/>

    <!-- Right Buffing Wheel (Fine Wire / Scouring Brush / Sikat Halus) -->
    <rect x="390" y="250" width="70" height="85" rx="6" fill="#64748B" stroke="#475569" stroke-width="2"/>
    <!-- Wire lines -->
    <line x1="395" y1="260" x2="455" y2="260" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="395" y1="280" x2="455" y2="280" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="395" y1="300" x2="455" y2="300" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="395" y1="320" x2="455" y2="320" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M 390 240 L 470 240 L 470 320 L 390 350 Z" fill="none" stroke="#94A3B8" stroke-width="3"/>

    <!-- Integrated Cyclone Dust Exhaust Pipes (Rear) -->
    <path d="M 175 235 L 175 160 L 260 160" fill="none" stroke="#475569" stroke-width="12"/>
    <path d="M 425 235 L 425 160 L 340 160" fill="none" stroke="#475569" stroke-width="12"/>
    <!-- Cyclone Funnel Collector -->
    <path d="M 260 140 L 340 140 L 315 220 L 285 220 Z" fill="#1E293B" stroke="#F5B301" stroke-width="1.5"/>

    <!-- Dust Filter Bag on Base -->
    <rect x="180" y="370" width="240" height="85" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <line x1="195" y1="412" x2="405" y2="412" stroke="#475569" stroke-width="2"/>

    <!-- Power & Speed Control Switch -->
    <circle cx="230" cy="475" r="14" fill="#22C55E" stroke="#020617" stroke-width="2"/>
    <circle cx="270" cy="475" r="14" fill="#DC2626" stroke="#020617" stroke-width="2"/>
    <rect x="310" y="465" width="100" height="20" rx="3" fill="#020617"/>
    <text x="360" y="479" font-family="monospace" font-size="9" fill="#F5B301" text-anchor="middle">2800 RPM</text>
  </g>

  <g transform="translate(40, 50)">
    <rect width="160" height="26" rx="13" fill="#F5B301"/>
    <text x="80" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">MODEL: PJ-BUFF-DUAL</text>
  </g>
  <g transform="translate(405, 50)">
    <rect width="155" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="482" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">BUFFING PENGASAR SOL</text>
  </g>
</svg>

