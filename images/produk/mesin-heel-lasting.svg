<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="heelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="heelYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <filter id="heelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgG8)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Machine: Hydraulic Heel Lasting Machine (PJ-HEEL-AUTO) -->
  <g filter="url(#heelShadow)">
    <rect x="150" y="330" width="300" height="180" rx="10" fill="url(#heelDark)"/>
    <rect x="170" y="505" width="50" height="15" rx="3" fill="#020617"/>
    <rect x="380" y="505" width="50" height="15" rx="3" fill="#020617"/>

    <!-- Slanted Upper Forming Bay -->
    <path d="M 160 330 L 200 190 L 400 190 L 440 330 Z" fill="url(#heelDark)"/>
    <rect x="200" y="185" width="200" height="12" fill="url(#heelYellow)"/>

    <!-- Heel Clamping Band & Wiper Unit -->
    <circle cx="300" cy="250" r="50" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <!-- U-shaped Heel Wiper Band (Silicone/Steel) -->
    <path d="M 270 240 Q 300 215 330 240 L 330 265 Q 300 280 270 265 Z" fill="url(#heelYellow)"/>
    <!-- Central Piston Ram for Last Pin -->
    <rect x="292" y="265" width="16" height="50" fill="#E2E8F0"/>

    <!-- Dual Hydraulic Gauges -->
    <circle cx="230" cy="150" r="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <circle cx="370" cy="150" r="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <line x1="230" y1="150" x2="238" y2="142" stroke="#DC2626" stroke-width="2"/>
    <line x1="370" y1="150" x2="378" y2="142" stroke="#DC2626" stroke-width="2"/>

    <!-- Operator Control Module -->
    <rect x="200" y="355" width="200" height="60" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect x="215" y="365" width="70" height="20" rx="3" fill="#020617"/>
    <text x="250" y="379" font-family="monospace" font-size="10" fill="#22C55E" text-anchor="middle">HEEL AUTO</text>
    <circle cx="310" cy="375" r="7" fill="#22C55E"/>
    <circle cx="335" cy="375" r="7" fill="#F5B301"/>
    <circle cx="360" cy="375" r="7" fill="#EF4444"/>

    <!-- Foot Pedal Rods (Subtle bottom) -->
    <rect x="240" y="480" width="120" height="20" rx="4" fill="#020617"/>
    <text x="300" y="494" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#F5B301" text-anchor="middle">PJ-HEEL-AUTO SPEC</text>
  </g>

  <g transform="translate(40, 50)">
    <rect width="160" height="26" rx="13" fill="#F5B301"/>
    <text x="80" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">MODEL: PJ-HEEL-AUTO</text>
  </g>
  <g transform="translate(405, 50)">
    <rect width="155" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="482" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">CETAK TUMIT SEPATU</text>
  </g>
</svg>

