<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="skivDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="skivYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <filter id="skivShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgG6)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Machine: Leather Skiving Machine (Mesin Seset Kulit PJ-SKIV-801) -->
  <g filter="url(#skivShadow)">
    <!-- Base Table -->
    <rect x="120" y="430" width="360" height="30" rx="4" fill="#CBD5E1"/>
    <rect x="140" y="460" width="320" height="55" rx="4" fill="url(#skivDark)"/>
    <rect x="170" y="515" width="45" height="15" rx="2" fill="#020617"/>
    <rect x="385" y="515" width="45" height="15" rx="2" fill="#020617"/>

    <!-- Main Skiving Head Casting -->
    <path d="M 160 430 L 160 250 C 160 220 180 200 220 200 L 400 200 C 430 200 440 220 440 250 L 440 430 Z" fill="url(#skivDark)"/>
    <!-- Yellow Accent Top Cover -->
    <rect x="160" y="210" width="280" height="18" fill="url(#skivYellow)"/>

    <!-- Bell Skiving Knife (Pisau Mangkuk Putar) -->
    <circle cx="260" cy="330" r="48" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
    <circle cx="260" cy="330" r="32" fill="#94A3B8"/>
    <circle cx="260" cy="330" r="14" fill="#1E293B"/>

    <!-- Feed Roll Stone / Emery Stone Wheel -->
    <circle cx="340" cy="330" r="28" fill="#F5B301" stroke="#D99A00" stroke-width="2"/>
    <circle cx="340" cy="330" r="12" fill="#0F172A"/>

    <!-- Integrated Sharpening Grinding Wheel Assembly (Asahan Pisau) -->
    <rect x="220" y="240" width="40" height="35" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <circle cx="240" cy="275" r="12" fill="#F5B301"/>

    <!-- Waste Chute / Suction Pipe for Leather Shavings -->
    <path d="M 270 380 L 320 380 L 330 430 L 260 430 Z" fill="#020617"/>
    <rect x="280" y="430" width="40" height="50" rx="3" fill="#334155"/>

    <!-- Thickness Adjustment Micrometer Dial -->
    <circle cx="400" cy="280" r="22" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
    <line x1="400" y1="280" x2="412" y2="272" stroke="#DC2626" stroke-width="2.5"/>
    <text x="400" y="315" font-family="monospace" font-size="9" fill="#F5B301" text-anchor="middle">0.1 - 2.5mm</text>

    <!-- Model Plaque -->
    <rect x="235" y="475" width="130" height="26" rx="4" fill="#0F172A" stroke="#F5B301" stroke-width="1"/>
    <text x="300" y="488" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#F5B301" text-anchor="middle">LEATHER SKIVING</text>
    <text x="300" y="497" font-family="Poppins, sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle">HIGH SPEED BELL KNIFE</text>
  </g>

  <!-- Badges -->
  <g transform="translate(40, 50)">
    <rect width="150" height="26" rx="13" fill="#F5B301"/>
    <text x="75" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">MODEL: PJ-SKIV-801</text>
  </g>
  <g transform="translate(415, 50)">
    <rect width="145" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="487" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">SESET KULIT UPPER</text>
  </g>
</svg>

