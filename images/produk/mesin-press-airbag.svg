<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="airDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="airYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <filter id="airShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgG9)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Machine: Airbag Pneumatic Sole Press Machine (PJ-AIR-PRESS) -->
  <g filter="url(#airShadow)">
    <rect x="140" y="440" width="320" height="70" rx="8" fill="url(#airDark)"/>
    <rect x="160" y="510" width="45" height="15" rx="3" fill="#020617"/>
    <rect x="395" y="510" width="45" height="15" rx="3" fill="#020617"/>

    <!-- Dual Heavy Columns -->
    <rect x="160" y="170" width="40" height="270" rx="4" fill="url(#airDark)"/>
    <rect x="400" y="170" width="40" height="270" rx="4" fill="url(#airDark)"/>

    <!-- Crosshead Beam -->
    <rect x="150" y="150" width="300" height="50" rx="6" fill="url(#airYellow)"/>
    <rect x="180" y="155" width="240" height="8" fill="#1E293B"/>

    <!-- Pneumatic Cylinder Unit -->
    <rect x="260" y="130" width="80" height="75" rx="6" fill="#1E293B"/>
    <rect x="285" y="205" width="30" height="60" fill="#CBD5E1"/>

    <!-- Transparent / Pressure Locking Cover Box -->
    <rect x="200" y="260" width="200" height="120" rx="8" fill="#F1F5F9" fill-opacity="0.5" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Airbag Inflatable Membrane (Kantung Udara Press Sol) -->
    <path d="M 220 375 Q 300 340 380 375 Z" fill="#F5B301"/>
    <path d="M 225 365 Q 300 330 375 365 Z" fill="#1E293B" opacity="0.8"/>

    <!-- Shoe Silhouette Pressed Inside Airbag -->
    <path d="M 240 350 Q 280 335 320 345 Q 350 335 360 355 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

    <!-- Pressure Regulator & Gauge -->
    <circle cx="445" cy="220" r="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <line x1="445" y1="220" x2="453" y2="214" stroke="#DC2626" stroke-width="2"/>
    <text x="445" y="250" font-family="monospace" font-size="8" fill="#F5B301" text-anchor="middle">6.5 BAR</text>

    <!-- Digital Timer Controller -->
    <rect x="240" y="455" width="120" height="40" rx="4" fill="#020617" stroke="#F5B301" stroke-width="1"/>
    <text x="300" y="475" font-family="monospace" font-size="12" font-weight="700" fill="#22C55E" text-anchor="middle">08.0s AUTO</text>
    <text x="300" y="488" font-family="Poppins, sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle">PNEUMATIC SOLE ATTACH</text>
  </g>

  <g transform="translate(40, 50)">
    <rect width="160" height="26" rx="13" fill="#F5B301"/>
    <text x="80" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">MODEL: PJ-AIR-PRESS</text>
  </g>
  <g transform="translate(405, 50)">
    <rect width="155" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="482" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">AIRBAG SOLE PRESS</text>
  </g>
</svg>

