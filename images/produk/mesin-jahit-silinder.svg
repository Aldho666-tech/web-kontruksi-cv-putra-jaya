<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG13" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="cylDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cylYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <filter id="cylShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgG13)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Machine: Cylinder Bed Sewing Machine (PJ-SEW-CYL) -->
  <g filter="url(#cylShadow)">
    <rect x="110" y="440" width="380" height="24" rx="3" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="120" y="464" width="360" height="50" rx="4" fill="url(#cylDark)"/>
    <rect x="150" y="514" width="40" height="15" rx="2" fill="#0F172A"/>
    <rect x="410" y="514" width="40" height="15" rx="2" fill="#0F172A"/>

    <!-- Cylinder Horizontal Arm (Tabung Silinder Khas Sepatu Tubular) -->
    <rect x="150" y="320" width="180" height="42" rx="21" fill="url(#cylDark)" stroke="#475569" stroke-width="2"/>
    <circle cx="171" cy="341" r="18" fill="#CBD5E1"/>
    <!-- Needle throat at cylinder tip -->
    <rect x="165" y="320" width="12" height="10" fill="#E2E8F0"/>

    <!-- Main Vertical Column & Overhead Arm -->
    <path d="M 330 440 L 440 440 L 440 220 C 440 185 410 165 370 165 L 180 165 C 160 165 150 180 150 200 L 150 250 L 200 250 L 200 220 L 330 220 Z" fill="url(#cylDark)"/>
    <rect x="150" y="185" width="290" height="16" fill="url(#cylYellow)"/>

    <!-- Needle Bar down to Cylinder Bed -->
    <rect x="168" y="230" width="8" height="50" fill="#CBD5E1"/>
    <line x1="172" y1="280" x2="172" y2="320" stroke="#1E293B" stroke-width="3"/>

    <!-- Direct Drive Servo Wheel (Right) -->
    <circle cx="445" cy="240" r="30" fill="#CBD5E1" stroke="#475569" stroke-width="3"/>
    <circle cx="445" cy="240" r="12" fill="url(#cylYellow)"/>

    <!-- Thread Spool Rack -->
    <line x1="380" y1="165" x2="380" y2="95" stroke="#94A3B8" stroke-width="3"/>
    <line x1="330" y1="95" x2="430" y2="95" stroke="#94A3B8" stroke-width="3"/>
    <path d="M 345 95 L 352 125 L 366 125 L 374 95 Z" fill="#F5B301" opacity="0.8"/>
    <path d="M 390 95 L 398 125 L 412 125 L 420 95 Z" fill="#3B82F6" opacity="0.8"/>

    <!-- Spec Brand Plaque -->
    <rect x="240" y="475" width="140" height="28" rx="4" fill="#020617" stroke="#F5B301" stroke-width="1"/>
    <text x="310" y="488" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#F5B301" text-anchor="middle">CYLINDER BED 46MM</text>
    <text x="310" y="498" font-family="Poppins, sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle">UNISON TRIPLE FEED</text>
  </g>

  <g transform="translate(40, 50)">
    <rect width="155" height="26" rx="13" fill="#F5B301"/>
    <text x="77" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">MODEL: PJ-SEW-CYL</text>
  </g>
  <g transform="translate(410, 50)">
    <rect width="150" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="485" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">JAHIT SILINDER BED</text>
  </g>
</svg>

