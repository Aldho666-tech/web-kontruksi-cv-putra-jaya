<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="pressDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pressYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <linearGradient id="chromeRam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="pressShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgG4)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Machine: Hydraulic Sole Attaching Press -->
  <g filter="url(#pressShadow)">
    <!-- Base Foundation -->
    <rect x="160" y="450" width="280" height="65" rx="8" fill="url(#pressDark)"/>
    <rect x="180" y="515" width="50" height="15" rx="3" fill="#020617"/>
    <rect x="370" y="515" width="50" height="15" rx="3" fill="#020617"/>

    <!-- Left & Right Heavy Steel Columns -->
    <rect x="175" y="160" width="45" height="295" rx="4" fill="url(#pressDark)"/>
    <rect x="380" y="160" width="45" height="295" rx="4" fill="url(#pressDark)"/>

    <!-- Top Hydraulic Crossbeam -->
    <rect x="160" y="140" width="280" height="55" rx="6" fill="url(#pressYellow)"/>
    <rect x="175" y="145" width="250" height="10" fill="#1E293B"/>

    <!-- Main Hydraulic Top Cylinder -->
    <rect x="260" y="120" width="80" height="80" rx="6" fill="url(#pressDark)"/>
    <!-- Chrome Hydraulic Ram Piston -->
    <rect x="280" y="195" width="40" height="85" fill="url(#chromeRam)"/>

    <!-- Overhead Shoe Last Pressure Arm (Toe & Heel Clamps) -->
    <rect x="235" y="280" width="130" height="25" rx="4" fill="url(#pressDark)"/>
    <!-- Heel Press Rod -->
    <rect x="250" y="305" width="16" height="35" rx="2" fill="url(#chromeRam)"/>
    <circle cx="258" cy="342" r="12" fill="#F5B301"/>
    <!-- Toe Press Rod -->
    <rect x="334" y="305" width="16" height="35" rx="2" fill="url(#chromeRam)"/>
    <circle cx="342" cy="342" r="12" fill="#F5B301"/>

    <!-- Lower Work Table / Sole Cushion Chamber -->
    <rect x="200" y="380" width="200" height="75" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <!-- Silicone / Oil Bag Bed for Shoes -->
    <rect x="220" y="385" width="160" height="30" rx="6" fill="#F5B301" opacity="0.9"/>
    <!-- Shoe Last Silhouette In Place -->
    <path d="M 235 375 Q 260 355 300 365 Q 355 350 365 375 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

    <!-- Side Clamping Pistons (Sole Edge Presses) -->
    <rect x="205" y="360" width="16" height="28" rx="2" fill="url(#chromeRam)"/>
    <rect x="379" y="360" width="16" height="28" rx="2" fill="url(#chromeRam)"/>

    <!-- Pressure Gauge -->
    <circle cx="300" cy="95" r="25" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <circle cx="300" cy="95" r="21" fill="#F8FAFC"/>
    <line x1="300" y1="95" x2="312" y2="85" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <circle cx="300" cy="95" r="4" fill="#0F172A"/>

    <!-- Control Box & Digital Timer (Right Side) -->
    <rect x="430" y="240" width="75" height="110" rx="6" fill="#0F172A" stroke="#F5B301" stroke-width="1.5"/>
    <rect x="440" y="250" width="55" height="25" rx="3" fill="#020617"/>
    <text x="467" y="267" font-family="monospace" font-size="12" font-weight="700" fill="#22C55E" text-anchor="middle">12.0s</text>
    <circle cx="452" cy="295" r="6" fill="#22C55E"/>
    <circle cx="478" cy="295" r="6" fill="#DC2626"/>
    <rect x="442" y="315" width="51" height="18" rx="3" fill="#F5B301"/>
    <text x="467" y="327" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#0F172A" text-anchor="middle">START</text>

    <!-- Emergency Stop Mushroom -->
    <circle cx="170" cy="230" r="14" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Identity Plate -->
    <rect x="240" y="470" width="120" height="26" rx="3" fill="#020617" stroke="#F5B301" stroke-width="1"/>
    <text x="300" y="482" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#F5B301" text-anchor="middle">HYDRAULIC SOLE PRESS</text>
    <text x="300" y="492" font-family="Poppins, sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle">UNIVERSAL 4-CYLINDER</text>
  </g>

  <!-- Badges -->
  <g transform="translate(40, 50)">
    <rect width="155" height="26" rx="13" fill="#F5B301"/>
    <text x="77" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">MODEL: PJ-SOLE-HYD4</text>
  </g>
  <g transform="translate(410, 50)">
    <rect width="150" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="485" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">4-CYLINDER HYDRAULIC</text>
  </g>
</svg>

