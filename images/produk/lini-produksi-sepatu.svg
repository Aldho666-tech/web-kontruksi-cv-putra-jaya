<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG17" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="lineDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="lineYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <filter id="lineShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgG17)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Machine: Complete Shoe Production Assembly Line (Turnkey Factory Setup) -->
  <g filter="url(#lineShadow)">
    <!-- Factory Floor Base Foundation -->
    <rect x="70" y="440" width="460" height="60" rx="6" fill="url(#lineDark)"/>
    <line x1="70" y1="450" x2="530" y2="450" stroke="#F5B301" stroke-width="3"/>

    <!-- Conveyor Track Linking All Stations -->
    <rect x="80" y="380" width="440" height="35" rx="4" fill="#020617"/>
    <line x1="80" y1="397" x2="520" y2="397" stroke="#64748B" stroke-width="2" stroke-dasharray="8,6"/>

    <!-- Station 1: Cutting & Prep (Left) -->
    <rect x="90" y="260" width="75" height="120" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect x="95" y="270" width="65" height="30" rx="3" fill="url(#lineYellow)"/>
    <text x="127" y="289" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#020617" text-anchor="middle">CUTTING</text>

    <!-- Station 2: Sewing Post-Bed Upper Line -->
    <rect x="180" y="240" width="80" height="140" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect x="185" y="250" width="70" height="30" rx="3" fill="url(#lineYellow)"/>
    <text x="220" y="269" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#020617" text-anchor="middle">SEWING</text>
    <circle cx="220" cy="310" r="14" fill="#CBD5E1"/>

    <!-- Station 3: Toe & Heel Lasting (Center) -->
    <rect x="275" y="210" width="90" height="170" rx="6" fill="url(#lineDark)" stroke="#F5B301" stroke-width="2"/>
    <rect x="280" y="220" width="80" height="35" rx="3" fill="url(#lineYellow)"/>
    <text x="320" y="241" font-family="Poppins, sans-serif" font-size="9" font-weight="700" fill="#020617" text-anchor="middle">LASTING</text>
    <!-- PLC Screen on Lasting unit -->
    <rect x="295" y="270" width="50" height="25" rx="2" fill="#0284C7"/>

    <!-- Station 4: Sole Attaching Press & Heat Tunnel -->
    <rect x="380" y="230" width="85" height="150" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect x="385" y="240" width="75" height="30" rx="3" fill="url(#lineYellow)"/>
    <text x="422" y="259" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#020617" text-anchor="middle">PRESS SOL</text>
    <rect x="395" y="285" width="55" height="30" rx="2" fill="#DC2626"/>

    <!-- Station 5: Chiller & Packaging / QC (Right) -->
    <rect x="480" y="260" width="45" height="120" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect x="485" y="270" width="35" height="25" rx="2" fill="#38BDF8"/>
    <text x="502" y="286" font-family="Poppins, sans-serif" font-size="7" font-weight="700" fill="#020617" text-anchor="middle">QC</text>

    <!-- Shoes in Flow on Conveyor -->
    <path d="M 170 375 L 180 370 L 190 375 Z" fill="#F5B301"/>
    <path d="M 265 375 L 275 370 L 285 375 Z" fill="#F5B301"/>
    <path d="M 370 375 L 380 370 L 390 375 Z" fill="#F5B301"/>
    <path d="M 470 375 L 480 370 L 490 375 Z" fill="#F5B301"/>

    <!-- Industrial Factory Pipe Racks (Top) -->
    <line x1="80" y1="160" x2="520" y2="160" stroke="#475569" stroke-width="6"/>
    <line x1="80" y1="175" x2="520" y2="175" stroke="#F5B301" stroke-width="3"/>

    <!-- Central Plaque -->
    <rect x="180" y="460" width="240" height="26" rx="4" fill="#020617" stroke="#F5B301" stroke-width="1"/>
    <text x="300" y="476" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#F5B301" text-anchor="middle">TURNKEY SHOE FACTORY ASSEMBLY LINE</text>
  </g>

  <g transform="translate(40, 50)">
    <rect width="180" height="26" rx="13" fill="#F5B301"/>
    <text x="90" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">PAKET: PJ-LINE-CUSTOM</text>
  </g>
  <g transform="translate(390, 50)">
    <rect width="170" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="475" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">FULL FACTORY LINE</text>
  </g>
</svg>

