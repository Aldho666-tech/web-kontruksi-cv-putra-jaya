<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG15" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="eyeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="eyeYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <filter id="eyeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgG15)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Machine: Automatic Shoe Eyelet Machine (PJ-EYE-AUTO) -->
  <g filter="url(#eyeShadow)">
    <rect x="180" y="440" width="240" height="65" rx="8" fill="url(#eyeDark)"/>
    <rect x="195" y="505" width="45" height="15" rx="3" fill="#020617"/>
    <rect x="360" y="505" width="45" height="15" rx="3" fill="#020617"/>

    <!-- Vertical Stand Column -->
    <rect x="270" y="230" width="60" height="210" fill="url(#eyeDark)"/>

    <!-- Top Rotary Vibratory Hopper for Eyelets (Mangkuk Mata Ayam) -->
    <circle cx="300" cy="140" r="55" fill="url(#eyeDark)" stroke="#F5B301" stroke-width="2"/>
    <circle cx="300" cy="140" r="35" fill="#0F172A"/>
    <circle cx="300" cy="140" r="15" fill="#CBD5E1"/>

    <!-- Feed Chute Track (Rel Luncuran Mata Ayam) -->
    <path d="M 300 195 L 300 240 L 250 280 L 250 330" fill="none" stroke="#F5B301" stroke-width="8"/>
    <!-- Eyelets Sliding in track -->
    <circle cx="280" cy="255" r="4" fill="#E2E8F0"/>
    <circle cx="265" cy="270" r="4" fill="#E2E8F0"/>
    <circle cx="250" cy="300" r="4" fill="#E2E8F0"/>

    <!-- Punching & Clinching Head / Anvil -->
    <rect x="220" y="325" width="60" height="40" rx="4" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
    <rect x="235" y="365" width="30" height="30" rx="2" fill="#0F172A"/>
    <!-- Laser Pointer Guide -->
    <circle cx="250" cy="365" r="2" fill="#EF4444"/>
    <line x1="240" y1="365" x2="260" y2="365" stroke="#EF4444" stroke-width="1"/>
    <line x1="250" y1="355" x2="250" y2="375" stroke="#EF4444" stroke-width="1"/>

    <!-- Shoe Eyelet Stay Leather Sample -->
    <rect x="200" y="380" width="100" height="15" rx="3" fill="#B45309"/>
    <circle cx="220" cy="387" r="3" fill="#CBD5E1"/>
    <circle cx="250" cy="387" r="3" fill="#F5B301"/>
    <circle cx="280" cy="387" r="3" fill="#CBD5E1"/>

    <!-- Flywheel & Motor Drive (Right) -->
    <circle cx="370" cy="250" r="35" fill="#475569" stroke="#1E293B" stroke-width="3"/>
    <circle cx="370" cy="250" r="15" fill="url(#eyeYellow)"/>

    <rect x="230" y="460" width="140" height="25" rx="3" fill="#020617" stroke="#F5B301" stroke-width="1"/>
    <text x="300" y="476" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#F5B301" text-anchor="middle">AUTO EYELET 240/MIN</text>
  </g>

  <g transform="translate(40, 50)">
    <rect width="160" height="26" rx="13" fill="#F5B301"/>
    <text x="80" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">MODEL: PJ-EYE-AUTO</text>
  </g>
  <g transform="translate(405, 50)">
    <rect width="155" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="482" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">PASANG MATA AYAM</text>
  </g>
</svg>

