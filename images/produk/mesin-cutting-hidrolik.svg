<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="50%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#171923"/>
    </linearGradient>
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#CBD5E0"/>
      <stop offset="100%" stop-color="#A0AEC0"/>
    </linearGradient>
    <linearGradient id="yellowAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Canvas -->
  <rect width="600" height="600" fill="url(#bgG)"/>
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Technical Grid Subtle -->
  <g stroke="#E2E8F0" stroke-width="0.5" opacity="0.4">
    <line x1="80" y1="80" x2="520" y2="80"/>
    <line x1="80" y1="520" x2="520" y2="520"/>
    <line x1="80" y1="80" x2="80" y2="520"/>
    <line x1="520" y1="80" x2="520" y2="520"/>
  </g>

  <!-- Machine: Swing Arm Hydraulic Cutting Press 27T -->
  <g filter="url(#cardShadow)">
    <!-- Base / Bed Stand -->
    <rect x="130" y="440" width="340" height="70" rx="6" fill="url(#metalDark)"/>
    <rect x="150" y="500" width="60" height="15" rx="3" fill="#0F172A"/>
    <rect x="390" y="500" width="60" height="15" rx="3" fill="#0F172A"/>

    <!-- Cutting Table Area (Polymer Cutting Board) -->
    <rect x="140" y="380" width="320" height="60" rx="4" fill="#E2E8F0"/>
    <rect x="160" y="385" width="280" height="50" rx="2" fill="#FEF08A" stroke="#F5B301" stroke-width="1.5"/>

    <!-- Main Vertical Column / Cylinder Housing -->
    <rect x="170" y="160" width="110" height="230" rx="8" fill="url(#metalDark)"/>
    <!-- Chrome Column Guide Rod -->
    <rect x="200" y="180" width="50" height="200" rx="4" fill="url(#metalSilver)"/>

    <!-- Swing Arm (Hydraulic Head) -->
    <path d="M 170 170 L 450 220 L 440 280 L 170 240 Z" fill="url(#yellowAccent)"/>
    <rect x="220" y="240" width="210" height="30" rx="4" fill="url(#metalDark)"/>

    <!-- Stroke Adjustment Handwheel & Gauge -->
    <circle cx="420" cy="210" r="22" fill="url(#metalSilver)" stroke="#4A5568" stroke-width="3"/>
    <circle cx="420" cy="210" r="10" fill="#1A202C"/>
    <!-- Handle -->
    <rect x="415" y="178" width="10" height="24" rx="3" fill="#F5B301"/>

    <!-- Pressure Gauge -->
    <circle cx="225" cy="130" r="24" fill="#FFFFFF" stroke="#1A202C" stroke-width="3"/>
    <circle cx="225" cy="130" r="20" fill="#F8FAFC"/>
    <line x1="225" y1="130" x2="236" y2="120" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="225" cy="130" r="3" fill="#DC2626"/>

    <!-- Two-Hand Pushbuttons (Safety Requirement) -->
    <circle cx="270" cy="285" r="12" fill="#DC2626" stroke="#1A202C" stroke-width="2"/>
    <circle cx="390" cy="295" r="12" fill="#DC2626" stroke="#1A202C" stroke-width="2"/>

    <!-- Oil Tank & Motor Base -->
    <rect x="110" y="320" width="70" height="130" rx="4" fill="#1A202C"/>
    <rect x="120" y="340" width="15" height="40" rx="2" fill="#22C55E"/>
    <!-- Electric Motor Fins -->
    <rect x="95" y="360" width="25" height="60" rx="2" fill="#475569"/>
    <line x1="98" y1="370" x2="117" y2="370" stroke="#94A3B8" stroke-width="2"/>
    <line x1="98" y1="385" x2="117" y2="385" stroke="#94A3B8" stroke-width="2"/>
    <line x1="98" y1="400" x2="117" y2="400" stroke="#94A3B8" stroke-width="2"/>

    <!-- Warning / Spec Plate -->
    <rect x="310" y="455" width="110" height="35" rx="3" fill="#1E293B" stroke="#F5B301" stroke-width="1"/>
    <text x="365" y="470" font-family="Poppins, sans-serif" font-size="9" font-weight="700" fill="#F5B301" text-anchor="middle">27 TON HYDRAULIC</text>
    <text x="365" y="482" font-family="Poppins, sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">SWING ARM PRESS</text>
  </g>

  <!-- Technical Spec Badge -->
  <g transform="translate(40, 50)">
    <rect width="130" height="26" rx="13" fill="#F5B301"/>
    <text x="65" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">MODEL: PJ-CUT-27T</text>
  </g>
  <g transform="translate(420, 50)">
    <rect width="140" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="490" y="17" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">KAPASITAS: 27 TON</text>
  </g>
</svg>

